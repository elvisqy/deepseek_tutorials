function dimMeaning(shape,note,name){
 if(!shape)return '';
 if(/^27270,(64|128),(1,)?(1|128|512)$/.test(shape)&&/SparseFlashMla|LightningIndexerV2|ScatterNdUpdate/.test(name)){
   const dims=shape.split(',');
   return '27270 个缓存页 × 每页 '+dims[1]+' 个槽'+(dims.length===4?' × '+dims[2]+' 个 KV 头':'')+' × 末轴 '+dims.at(-1)+' 维';
 }
 if(/^(41472|20736),(2304|4608|5120)$/.test(shape)&&/MoeDistribute|GroupedMatmul|SwiGlu|Clamp/.test(name))
   return shape.split(',')[0]+' 个路由缓冲行 × 每行 '+shape.split(',')[1]+' 维';
 if(note&&/图 token 槽|每头|请求槽|专家数|残差|词表|索引|组数|历史位置|查表项|量化尺度/.test(note)&&!note.includes('权重')&&knownShape[shape])return knownShape[shape];
 return '';

function tensorColumn(event, side, info){
 const isInput=side==='input';
 const shape=event[isInput?8:9], dtype=event[isInput?10:11], labels=info[isInput?'inputs':'outputs'];
 if(!shape&&!dtype)return '<span class="muted">本侧未记录形状或 dtype</span>';
 const shapes=shape?shape.split(';'):[], types=dtype?dtype.split(';'):[];
 const count=Math.max(shapes.length,types.length);
 const visible=[], empty=[];
 for(let i=0;i<count;i++){
   const dims=shapes[i]||'', type=types[i]||'', known=labels[i];
   const title='槽 '+(i+1);
   if(!dims&&(!type||type==='DT_UNDEFINED')){empty.push(title);continue;}
   const role=known||(dims?'运行时参数，具体角色未标注':'形状未记录，可能为标量、可选参数或内部描述');
   const meaning=dimMeaning(dims,known,event[3]);
   visible.push('<li><div><span class="slot">'+title+'</span> '+(dims?code('['+dims+']'):'<span class="muted">形状未记录</span>')+' '+(type?'<abbr title="'+esc(dtypeHelp[type]||type)+'">'+esc(type)+'</abbr>':'')+'</div><span>'+esc(role)+'</span>'+(meaning?'<small>'+esc(meaning)+'</small>':'')+'</li>');
 }
 return (visible.length?'<ol class="tensor-list">'+visible.join('')+'</ol>':'')+(empty.length?'<small class="missing">'+empty.join('、')+' 未记录或为可选槽</small>':'');
}

function optimizationFor(event, graph, label){
 const [start,,stream,name]=event;
 const kernel=event[12]||name;
 if(graph==='decode-prepare'&&stream===47){
  if(kernel==='VllmAscendQuantLightningIndexerV2Metadata')return 'indexerMeta';
  if(start>=316.56&&start<=404.52&&/GreaterEqual|FloorMod|FloorDiv|Equal|LogicalAnd|SelectV2/.test(name))return 'metadata';
  if(start>=1048.68&&start<1160.04&&name.startsWith('aclnnGather_'))return 'metadata';
 }
 if(graph==='layer-gap'&&['L1','L14'].includes(label)&&stream===546){
  const begin=label==='L1'?3637.10:22477.34;
  if(start>=begin&&!/Slice|MEMCPY/.test(name))return 'engram';
 }
 if(graph==='layer-attention'||graph==='layer-moe'){
  if(name==='HcPre'||name==='HcPost')return 'hc';
  if(name==='MoeGatingTopKHash')return 'routing';
  if(kernel==='TransposeBatchMatMul')return 'projection';
  if(name==='VllmAscendQuantLightningIndexerV2')return 'indexer';
  if(name==='SparseFlashMla'&&event[8]?.split(';')[4]?.endsWith(',512'))return 'sparse';
 }
}

function nodeDescription(event,context,streams,mla){
 const info=opInfo(event,context);
 const [start,,stream,name]=event;
 const kernel=event[12]||name;
 let title=graphName[kernel]||kernel;

 '<section class="graph-phase" id="layer-attention"><div class="graph-phase-title"><h3>Attention</h3><span>'+us(l.p-l.a)+' µs</span></div><p>'+attention+'</p>'+operatorGraph('layer-attention','Attention',aRows,label,l,streams)+'</section>'+
 '<section class="graph-phase" id="layer-moe"><div class="graph-phase-title"><h3>MoE</h3><span>'+us(l.c-l.b)+' µs</span></div><p>'+moe+'</p>'+operatorGraph('layer-moe','MoE',mRows,label,l,streams)+'</section>'+
 '<details class="graph-gap"><summary>查看本层实际时间轴</summary><p class="brief muted">三流算子累计 '+us(l.total)+' µs，执行区间取并集为 '+us(l.union)+' µs。</p>'+lanes(rows,l,streams)+'</details></section>';
}
function layerPage(isDraft){
 const key=isDraft?'draft':'target', graph=isDraft?d:t, i=state[key];
 const layerBtn=(l,cls)=>'<button data-layer="'+l.i+'" class="'+cls+(l.index!==null?' index':'')+'" aria-current="'+(l.i===i)+'">'+layerLabel(isDraft,l.i)+'</button>';
 const layerButtons=layers=>'<div class="layerbuttons">'+layers.map(l=>layerBtn(l,'')).join('')+'</div>';
 sidebar.innerHTML=isDraft?'<h3>选择草稿层</h3>'+layerButtons(graph.layers)+'<p class="muted">D0–D2 对应 mtp.0–mtp.2。</p>':'<h3>选择目标层</h3><p class="layer-group">Causal Encoder · L0–L19</p>'+layerButtons(graph.layers.slice(0,20))+'<p class="layer-group">Decoder · L20–L39</p>'+layerButtons(graph.layers.slice(20))+'<p class="muted">紫色描边为新索引层。L1、L14 的 Engram 前导可在对应层展开。</p>';
 const maxSpan=Math.max(...graph.layers.map(l=>l.span));
 const layerBars=graph.layers.map(l=>'<button type="button" class="layer-bar" data-layer="'+l.i+'" aria-current="'+(l.i===i)+'"><span>'+layerLabel(isDraft,l.i)+'</span><span class="layer-bar-track" aria-hidden="true"><span class="layer-bar-total" style="width:'+l.span/maxSpan*100+'%"><span class="layer-bar-attention" style="width:'+(l.p-l.a)/l.span*100+'%"></span><span class="layer-bar-moe" style="width:'+(l.c-l.b)/l.span*100+'%"></span></span></span><span>'+ms(l.span)+' ms</span></button>').join('');
 const tail=records(graph.layers.at(-1).c,graph.b,graph.id);
 const end=isDraft?'<details class="panel"><summary>草稿层之后生成五列 token</summary><p>尾部先将 [40, 4, 5120] 合为 [40, 5120]，归一化后用 1,229.06 µs 生成 [40, 129280] logits。随后每一步在 8 行上查 256 维 token embedding，做词表投影并加到对应的 logits 切片，执行一次 ArgMax，再回写结果作为后续输入。低秩 Markov 路径由张量形状、重复序列和模型资料互相印证。</p>'+ops('draft-head',tail)+'</details>':
  '<details class="panel"><summary>L39 之后的目标图尾</summary><p>观察到 TensorMove、四路隐藏流的加权归约与最终 RMSNorm。全词表 LM Head 发生在图退出之后，可在「完整 Decode」的验收阶段查看。</p>'+ops('target-head',tail)+'</details>';
 main.innerHTML=layerDetail(graph,isDraft,i)+end+'<section class="panel" id="layer-all"><h2>逐层耗时对照</h2><p class="brief muted">绿色为 Attention，紫色为 MoE。两段之间的空隙计入层跨度。点击条形可切换算子图。</p><div class="layer-bar-list">'+layerBars+'</div></section>';
}
function method(){
 const links='<p>层结构与模型算子名称参考用户提供的《DeepSeek-V4.1-Flash 结构分析报告》第 2 章。模型算子可能对应多个 NPU 内核，也可能被融合进同一内核。表中保留本次 profiling 实际发出的内核名、Stream 和张量槽位。</p><p class="reference"><a href="https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/blob/main/config.json">DeepSeek V4.1 Flash 官方模型配置</a> · <a href="https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/blob/main/inference/model.py">官方参考实现</a> · <a href="https://github.com/vllm-project/vllm-ascend/blob/main/docs/source/tutorials/models/DeepSeek-V4.1-Flash.md">vLLM Ascend 模型文档</a> · <a href="https://www.hiascend.com/document/detail/en/canncommercial/850/API/aolapi/context/ops-transformer/aclnnMoeDistributeDispatchV2.md">CANN Dispatch V2</a> · <a href="https://www.hiascend.com/document/detail/zh/CANNCommunityEdition/850/API/aolapi/context/ops-transformer/aclnnMoeDistributeCombineV2.md">CANN Combine V2</a></p>';
 sidebar.innerHTML='<h3>采样范围</h3><p>本报告使用压缩包内 NPU 0 的硬件轨迹、kernel 明细和运行配置。</p>';
 main.innerHTML='<section class="panel"><h2>测试场景</h2><p>DeepSeek V4.1 Flash 在 Ascend 上的 P/D 分离热前缀压测，输入 / 输出目标长度 128K / 1K，选取 pure-D 20 ms 档采样。P 侧 DP4 / PCP4 / TP1，D 侧 DP16 / TP1 / EP16。归档记录 MRv2、W4A8、FULL_DECODE_ONLY 和 DSpark 5 token，P 侧热前缀命中 99.903%。</p>'+
 table(['项目','归档记录'],[tr(['AISBench','最大并发 144，576 / 576 请求完成']),tr(['服务侧','平均 TPOT 17.7 ms，P99 19.1 ms，总输出 6,372.94 token/s']),tr(['采样范围','D 侧 NPU 0，DP0 / TP0 / EP0。控制窗口约 4.62 s。']),tr(['运行时','CANN 9.2.0，torch_npu 2.10.0.post7']),tr(['批形状','目标图 48 行，草稿图 40 行，验收结果形状 [8, 6]，草稿回写块 [8, 5]。图张量边界无法确认每行的实际有效 token。'])])+
 '</section><section class="panel"><h2>层号与统计口径</h2><ol><li>从 <code>trace_view.json</code> 的 Ascend Hardware 轨道选择第 9 次目标图重放。两次输入重排边界的原始时间戳分别为 '+code(control.st)+' 和 '+code(control.et)+' µs。全采样窗口记录 80 次图启动，样本选中 Model ID 12 与 72。</li><li>用图内连续成对的 HcPre / HcPost 恢复层号，逐层核对均有 1 次 SparseFlashMla、1 次 Dispatch、1 次 Combine。KV 和共享专家流的归属根据执行顺序、流号和形状推定。层间动作另列，避免将后续层的 Engram 算进前一层。</li><li>按 Model ID、Stream、Task ID 与开始时间对齐 <code>kernel_details.csv</code>。2,333 个执行或搬运事件中，2,279 个带可匹配的输入形状。空栏保留为缺失。原始 shape 按分号拆行，每行逗号分隔张量维度。</li><li>层跨度按 mHC 边界计算。算子累计允许重叠，执行区间并集去重，剩余差值可包含事件间空隙和等待。MoE Dispatch / Combine 为融合 EP 算子，通用 step CSV 的独立 Communication 计数无法计量融合算子内的通信。</li><li>公开配置用于解读 trace 中的索引、KV 与 Engram 路径。跨层索引共享、草稿隐藏状态取点和流的职责由架构与轨迹交叉判断，归档未提供逐层 NVTX 标记或缓冲地址的证据。</li><li>完整采样窗口里还有一个 <code>_prepare_prefill_inputs_kernel</code>，选中这轮没有该事件。第 1 个目标图附近有一次约 91.54 ms 的 Dispatch 长尾，位于所选样本之外。单卡记录不足以定位跨 Rank 长尾原因。</li></ol>'+links+
 '</section><section class="panel"><h2>归档内证据</h2><ul><li><code>capture.json</code>、<code>profiler_info_0.json</code>、<code>profiler_metadata.json</code></li><li><code>ASCEND_PROFILER_OUTPUT/trace_view.json</code>、<code>kernel_details.csv</code>、<code>step_trace_time.csv</code></li><li><code>config/l00770973-results-summary.json</code>、<code>l00770973-reference-adjustments-20261110.json</code>、<code>run_dp_template.sh</code></li></ul></section>';
}
function render(){
 opBindings.clear();
 nodeBindings.length=0;
 for(const tab of tabs)tab.setAttribute('aria-selected',String(tab.dataset.tab===state.tab));
 if(state.tab==='overview')overview();
 if(state.tab==='target'||state.tab==='draft')layerPage(state.tab==='draft');
 if(state.tab==='optimizations')optimizationPage();
 if(state.tab==='method')method();
 activateOps();
}
document.addEventListener('click',event=>{
 const button=event.target.closest('button');
 if(!button)return;
 const k=button.dataset;
 if(k.node!==undefined){showOperator(Number(k.node));return;}
 if(k.optCard){
  document.getElementById('operator-dialog').close();
  state.tab='optimizations';
  render();
  const card=document.getElementById('opt-'+k.optCard);
  card.scrollIntoView({block:'start'});
  card.focus({preventScroll:true});
  return;
 }
 if(k.optLocate){
  state.tab=k.view;
  if(k.view==='overview'){
   state.phase=0;
   state.prepare=Number(k.index);
  }else state[k.view]=Number(k.index);
  render();
  const node=main.querySelector('[data-optimization="'+k.optLocate+'"]');
  node?.scrollIntoView({block:'center'});
  node?.focus({preventScroll:true});
  return;
 }
 if(k.tab||k.go){state.tab=k.tab||k.go;render();return;}
 if(k.phase!==undefined){state.phase=Number(k.phase);render();return;}
 if(k.prepare!==undefined){
  state.prepare=Number(k.prepare);
  render();
  main.querySelector('[data-prepare][aria-pressed=true]')?.focus({preventScroll:true});
  return;
 }
 if(k.layer!==undefined){
  const jump=Boolean(button.closest('#layer-all'));
  state[state.tab]=Number(k.layer);
  render();
  sidebar.querySelector('[aria-current=true]')?.focus({preventScroll:true});
  const layer=document.getElementById('layer-detail');
  const top=layer.getBoundingClientRect().top;
  if(jump||top<0||top>window.innerHeight-140)layer.scrollIntoView({block:'start'});
 }
});
render();



</script>
